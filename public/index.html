<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>云搜 · 聚合网盘资源搜索</title>
<meta name="description" content="聚合夸克、阿里云盘、百度网盘、迅雷、UC、123 等多个网盘资源，一个搜索框搜遍全网盘。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230EA5E9'/%3E%3Cpath d='M10 20h11a4 4 0 0 0 .3-8A5.5 5.5 0 0 0 10.6 13 3.5 3.5 0 0 0 10 20z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>

<header class="topbar">
  <a class="brand" href="./" aria-label="云搜首页">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 18h10.5a4.5 4.5 0 0 0 .4-8.98A6 6 0 0 0 6.2 10.2 3.9 3.9 0 0 0 7 18Z" fill="currentColor"/>
        <circle cx="11" cy="14.4" r="2.6" stroke="#fff" stroke-width="1.5"/>
        <path d="m13.2 16.6 2.2 2.2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-text">
      <strong>云搜</strong>
      <em>CloudSearch</em>
    </span>
  </a>

  <div class="topbar-actions">
    <span class="src-status" id="srcStatus" title="搜索源状态">
      <i class="dot"></i><span id="srcStatusText">检测中…</span>
    </span>
    <button class="icon-btn" id="advBtn" title="高级搜索">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M7 12h10M10 17h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="icon-btn-label">高级</span>
    </button>
    <button class="icon-btn" id="themeBtn" title="切换主题">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main class="page" id="page">

  <!-- ============ 首屏 / 搜索区 ============ -->
  <section class="hero" id="hero">
    <h1 class="hero-title">一个框，搜遍全网盘</h1>
    <p class="hero-sub">聚合夸克 · 阿里云盘 · 百度网盘 · 迅雷 · UC · 123 · 天翼 等资源</p>

    <form class="searchbar" id="searchForm" role="search" autocomplete="off">
      <span class="searchbar-icon">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="2"/><path d="m15.8 15.8 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <input id="q" name="q" type="search" placeholder="输入片名、剧名、课程、软件、电子书……" aria-label="搜索关键词" spellcheck="false">
      <button type="button" class="clear-btn" id="clearBtn" hidden aria-label="清空">
        <svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="submit" class="search-btn" id="searchBtn">
        <span class="btn-text">搜索</span>
        <span class="btn-spinner" hidden></span>
      </button>
    </form>

    <div class="quick-row" id="quickRow">
      <div class="quick-block is-hot">
        <span class="quick-label">热搜</span>
        <div class="chips" id="hotChips"></div>
      </div>
      <div class="quick-block" id="historyBlock" hidden>
        <span class="quick-label">
          历史
          <button class="link-btn" id="clearHistory" type="button">清空</button>
        </span>
        <div class="chips" id="historyChips"></div>
      </div>
    </div>

    <div class="disk-wall" id="diskWall" aria-hidden="true"></div>
  </section>

  <!-- ============ 筛选栏 ============ -->
  <section class="filterbar" id="filterbar" hidden>
    <div class="type-tabs" id="typeTabs" role="tablist"></div>

    <div class="toolbar">
      <div class="result-meta" id="resultMeta"></div>
      <div class="toolbar-right">
        <div class="segmented view-seg" id="viewSeg" title="展示方式">
          <button class="seg active" data-view="merged">合并</button>
          <button class="seg" data-view="flat">列表</button>
        </div>
        <label class="select-wrap" title="排序方式">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M6 12h12M9 18h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <select id="sortSel" aria-label="排序方式">
            <option value="time">最新发布</option>
            <option value="relevance">默认相关度</option>
            <option value="name">名称排序</option>
          </select>
        </label>
        <button class="ghost-btn" id="refreshBtn" title="忽略缓存重新搜索">
          <svg viewBox="0 0 24 24" fill="none"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19.6 4.5v3.9h-3.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ 结果区 ============ -->
  <section class="results" id="results" aria-live="polite"></section>

  <div class="loadmore-wrap" id="loadMoreWrap" hidden>
    <button class="loadmore-btn" id="loadMore">
      <span>加载更多</span>
      <svg viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="state-box" id="stateBox"></div>
</main>

<footer class="footer">
  <p>云搜 CloudSearch · 聚合搜索，不存储任何资源 · 结果均来自公开索引</p>
  <p class="footer-dim">请遵守相关法律法规，仅用于学习与个人用途</p>
</footer>

<!-- ============ 高级搜索抽屉 ============ -->
<div class="drawer-mask" id="drawerMask" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="高级搜索">
  <div class="drawer-head">
    <h2>高级搜索</h2>
    <button class="icon-btn" id="drawerClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="drawer-body">
    <div class="field">
      <label class="field-label">搜索源</label>
      <div class="segmented" id="srcSeg">
        <button class="seg active" data-src="all">全部</button>
        <button class="seg" data-src="tg">TG 频道</button>
        <button class="seg" data-src="plugin">插件站</button>
      </div>
      <p class="field-hint">选择「TG 频道」或「插件站」可缩小范围、提升速度</p>
    </div>

    <div class="field">
      <label class="field-label">指定插件 <span class="count-tag" id="pluginCount">0</span></label>
      <input class="mini-input" id="pluginFilter" placeholder="筛选插件名…" spellcheck="false">
      <div class="tag-picker" id="pluginPicker"><p class="picker-empty">加载中…</p></div>
      <p class="field-hint">不选则搜索全部插件</p>
    </div>

    <div class="field">
      <label class="field-label">指定频道 <span class="count-tag" id="channelCount">0</span></label>
      <input class="mini-input" id="channelFilter" placeholder="筛选频道名…" spellcheck="false">
      <div class="tag-picker" id="channelPicker"><p class="picker-empty">加载中…</p></div>
    </div>

    <div class="field">
      <label class="field-label">搜索源健康状态</label>
      <div class="upstream-list" id="upstreamList"><p class="picker-empty">检测中…</p></div>
    </div>
  </div>

  <div class="drawer-foot">
    <button class="ghost-btn wide" id="resetAdv">重置</button>
    <button class="primary-btn wide" id="applyAdv">应用并搜索</button>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
